<!DOCTYPE html>
<html lang="en">
<head>
  <title>Lower Esopus Monitoring Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #map {
      height: 500px;
      width: 100%;
      margin-bottom: 25px;
    }

    #downloadButton {
      margin-bottom: 20px;
      padding: 8px 14px;
      cursor: pointer;
    }

    #downloadButton:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 25px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f2f2f2;
    }

    #chart {
      max-width: 100%;
      height: 350px;
    }
  </style>
</head>

<body>
  <h1>Lower Esopus Monitoring Map</h1>

  <div id="map"></div>

  <h2 id="dataTitle">Select a station and data type from the map</h2>

  <button id="downloadButton" disabled>Download Data</button>

  <table>
    <thead>
      <tr id="tableHead"></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <canvas id="chart"></canvas>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    var scriptUrl = 'https://script.google.com/macros/s/AKfycbzgnmlo_hbL7j8I9xKiNdS3dkuZ5izav7DYs1BCDW53vq81ECbI-0hJpLmvBmvfY774SA/exec';

    var currentRows = [];
    var currentFileName = 'data.csv';

    var stations = [
      {
        id: 'station1',
        name: 'Station 1',
        lat: 42.0123,
        lng: -74.1234
      },
      {
        id: 'station2',
        name: 'Station 2',
        lat: 42.0456,
        lng: -74.1567
      },
      {
        id: 'station3',
        name: 'Station 3',
        lat: 42.0789,
        lng: -74.1890
      },
      {
        id: 'station4',
        name: 'Station 4',
        lat: 42.1012,
        lng: -74.2012
      },
      {
        id: 'station5',
        name: 'Station 5',
        lat: 42.1345,
        lng: -74.2345
      },
      {
        id: 'station6',
        name: 'Station 6',
        lat: 42.1678,
        lng: -74.2678
      },
      {
        id: 'station7',
        name: 'Station 7',
        lat: 42.1901,
        lng: -74.2901
      }
    ];

    var map = L.map('map').setView([42.08, -74.18], 11);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    map.on('popupopen', function (e) {
      var select = e.popup.getElement().querySelector('.popupSelect');

      if (select) {
        select.addEventListener('change', function () {
          var stationId = select.dataset.stationId;
          var stationName = select.dataset.stationName;
          var dataType = select.value;

          if (dataType) {
            loadSheetData(stationId, stationName, dataType);
          }
        });
      }
    });

    stations.forEach(function (station) {
      L.marker([station.lat, station.lng]).addTo(map)
        .bindPopup(`
          <b>${station.name}</b><br><br>

          <label>Choose data:</label><br>
          <select
            class="popupSelect"
            data-station-id="${station.id}"
            data-station-name="${station.name}"
          >
            <option value="">Select one</option>
            <option value="flow">Flow data</option>
            <option value="water_quality">Water quality data</option>
          </select>
        `);
    });

    async function loadSheetData(stationId, stationName, dataType) {
      var dataLabel = dataType === 'flow' ? 'Flow Data' : 'Water Quality Data';

      document.getElementById('dataTitle').textContent =
        stationName + ' - ' + dataLabel;

      try {
        var url =
          scriptUrl +
          '?station=' + encodeURIComponent(stationId) +
          '&type=' + encodeURIComponent(dataType);

        var response = await fetch(url);

        if (!response.ok) {
          throw new Error('Could not load data. Status: ' + response.status);
        }

        var rows = await response.json();

        currentRows = rows;
        currentFileName = stationId + '_' + dataType + '.csv';
        document.getElementById('downloadButton').disabled = false;

        updateTable(rows);
        updateChart(rows, dataType, stationName);
      } catch (error) {
        document.getElementById('dataTitle').textContent =
          'Could not load ' + stationName + ' data: ' + error.message;

        console.error(error);
      }
    }

    function updateTable(rows) {
      var tableHead = document.getElementById('tableHead');
      var tableBody = document.getElementById('tableBody');

      tableHead.innerHTML = '';
      tableBody.innerHTML = '';

      rows[0].forEach(function (heading) {
        tableHead.innerHTML += '<th>' + heading + '</th>';
      });

      rows.slice(1).forEach(function (row) {
        var tr = '<tr>';

        row.forEach(function (cell) {
          tr += '<td>' + cell + '</td>';
        });

        tr += '</tr>';
        tableBody.innerHTML += tr;
      });
    }

    var chart;

    function updateChart(rows, dataType, stationName) {
      var dataRows = rows.slice(1);

      var xValues = dataRows.map(function (row) {
        return row[0];
      });

      var yValues = dataRows.map(function (row) {
        return Number(row[1]);
      });

      var dataLabel = dataType === 'flow' ? 'Flow' : 'Water Quality';

      if (chart) {
        chart.destroy();
      }

      chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels: xValues,
          datasets: [{
            label: stationName + ' - ' + dataLabel,
            data: yValues,
            borderColor: 'blue',
            backgroundColor: 'rgba(0, 0, 255, 0.1)',
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              title: {
                display: true,
                text: 'Date'
              }
            },
            y: {
              title: {
                display: true,
                text: dataLabel
              }
            }
          }
        }
      });
    }

    function downloadCurrentData() {
      if (!currentRows.length) {
        return;
      }

      var csvContent = currentRows.map(function (row) {
        return row.map(function (cell) {
          return '"' + String(cell).replace(/"/g, '""') + '"';
        }).join(',');
      }).join('\n');

      var blob = new Blob([csvContent], {
        type: 'text/csv;charset=utf-8;'
      });

      var url = URL.createObjectURL(blob);

      var link = document.createElement('a');
      link.href = url;
      link.download = currentFileName;
      link.click();

      URL.revokeObjectURL(url);
    }

    document
      .getElementById('downloadButton')
      .addEventListener('click', downloadCurrentData);
  </script>
</body>
</html>
